name: Fork registry guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  require-fork-registry-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require registry update for product changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          if ! printf '%s\n' "$changed_files" | grep -Eq '^(web/|deeptutor/|deeptutor_cli/|deeptutor_web/|deploy/|requirements/|Dockerfile$|docker-compose[^/]*\.ya?ml$|pyproject\.toml$|package[^/]*\.json$|pnpm-lock\.yaml$|yarn\.lock$)'; then
            echo "No product, dependency, build, or deployment changes detected."
            exit 0
          fi

          if printf '%s\n' "$changed_files" | grep -Fxq 'FORK-MAINTENANCE.md'; then
            echo "FORK-MAINTENANCE.md was updated with the relevant changes."
            exit 0
          fi

          echo "Product or deployment files changed without updating FORK-MAINTENANCE.md."
          echo "Read the registry, add/update the affected QL ID, and include verification and upgrade impact."
          exit 1
